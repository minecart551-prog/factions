plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

archivesBaseName = "${project.name}-mc${project.minecraft_version}"
version = project.mod_version
group = project.maven_group

repositories {
    maven { url "https://jitpack.io" }
    maven { url 'https://repo.bluecolored.de/releases' }
    maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
    maven { url "https://repo.mikeprimm.com/" }
    maven { url "https://maven.nucleoid.xyz/" }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

sourceSets {
    client {
        java {
            srcDirs = ['src/client/java']
        }
        resources {
            srcDirs = ['src/client/resources']
        }
    }
}

loom {
    log4jConfigs.from(file("log4j-dev.xml"))
}

configurations.all {
    resolutionStrategy {
        force "net.fabricmc:fabric-loader:${project.loader_version}"
        force "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
        force "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"
        eachDependency { details ->
            if (details.requested.group == 'net.fabricmc.fabric-api') {
                def versions = [
                    'fabric-api-base': '0.4.30+7abfd51577',
                    'fabric-api-lookup-api-v1': '1.6.35+4d8536c977',
                    'fabric-biome-api-v1': '13.0.11+0737cd8077',
                    'fabric-block-api-v1': '1.0.10+92a0d36777',
                    'fabric-block-view-api-v2': '1.0.0+92a0d36777',
                    'fabric-blockrenderlayer-v1': '1.1.40+b3afc78b77',
                    'fabric-client-tags-api-v1': '1.1.1+97bb207577',
                    'fabric-command-api-v1': '1.2.42+f71b366f4f',
                    'fabric-command-api-v2': '2.2.12+b3afc78b77',
                    'fabric-commands-v0': '0.2.59+df3654b34f',
                    'fabric-containers-v0': '0.1.87+df3654b34f',
                    'fabric-content-registries-v0': '4.0.10+57aed33f77',
                    'fabric-convention-tags-v1': '1.5.4+a1a980da77',
                    'fabric-crash-report-info-v1': '0.2.18+aeb40ebe77',
                    'fabric-data-attachment-api-v1': '1.1.5+b90db5744f',
                    'fabric-data-generation-api-v1': '12.3.1+0889cb7877',
                    'fabric-dimensions-v1': '2.1.53+8536527b77',
                    'fabric-entity-events-v1': '1.5.22+b3afc78b77',
                    'fabric-events-interaction-v0': '0.6.1+e91849a877',
                    'fabric-events-lifecycle-v0': '0.2.75+df3654b34f',
                    'fabric-game-rule-api-v1': '1.0.38+b04edc7a77',
                    'fabric-gametest-api-v1': '1.2.12+b3afc78b77',
                    'fabric-item-api-v1': '2.1.27+b3afc78b77',
                    'fabric-item-group-api-v1': '4.0.10+23d9108177',
                    'fabric-key-binding-api-v1': '1.0.36+fb8d95da77',
                    'fabric-keybindings-v0': '0.2.40+df3654b34f',
                    'fabric-lifecycle-events-v1': '2.2.21+b3afc78b77',
                    'fabric-loot-api-v2': '1.1.39+b3afc78b77',
                    'fabric-message-api-v1': '5.1.7+3265161977',
                    'fabric-mining-level-api-v1': '2.1.49+b3afc78b77',
                    'fabric-model-loading-api-v1': '1.0.2+709a987177',
                    'fabric-models-v0': '0.4.8+9386d8a74f',
                    'fabric-networking-api-v1': '1.3.10+eeb8eb3677',
                    'fabric-object-builder-api-v1': '11.1.1+6beca84877',
                    'fabric-particles-v1': '1.1.1+201a23a077',
                    'fabric-recipe-api-v1': '1.0.20+b3afc78b77',
                    'fabric-registry-sync-v0': '2.3.2+4df89eb277',
                    'fabric-renderer-api-v1': '3.2.0+39a511ba77',
                    'fabric-renderer-indigo': '1.5.0+39a511ba77',
                    'fabric-renderer-registries-v1': '3.2.54+df3654b34f',
                    'fabric-rendering-data-attachment-v1': '0.3.43+73761d2e4f',
                    'fabric-rendering-fluids-v1': '3.0.27+b3afc78b77',
                    'fabric-rendering-v0': '1.1.57+df3654b34f',
                    'fabric-rendering-v1': '3.0.7+b3afc78b77',
                    'fabric-resource-conditions-api-v1': '2.3.5+ea08f9d877',
                    'fabric-resource-loader-v0': '0.11.9+132c48c177',
                    'fabric-screen-api-v1': '2.0.7+b3afc78b77',
                    'fabric-screen-handler-api-v1': '1.3.29+b3afc78b77',
                    'fabric-sound-api-v1': '1.0.12+b3afc78b77',
                    'fabric-transfer-api-v1': '3.3.1+195226a777',
                    'fabric-transitive-access-wideners-v1': '4.3.0+6c31357e77'
                ]
                def version = versions[details.requested.name]
                if (version != null) {
                    details.useVersion version
                }
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "me.lucko:fabric-permissions-api:${project.lucko_permissions_version}"
    modImplementation "eu.pb4:placeholder-api:${project.papi_version}"
    include "com.flowpowered:flow-math:${project.flow_version}"
    implementation "com.flowpowered:flow-math:${project.flow_version}"
    modCompileOnly "us.dynmap:DynmapCoreAPI:${project.dynmap_api_version}"
    modCompileOnly "de.bluecolored.bluemap:BlueMapAPI:${project.bluemap_api_version}"
    modCompileOnly "maven.modrinth:styled-chat:${project.styled_chat_version}"
    modCompileOnly "xyz.jpenilla:squaremap-api:${project.squaremap_api_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}"}
    }
    from sourceSets.client.output
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

javadoc {
    source = sourceSets.main.allJava
}

// Configure client sourceset to have access to fabric rendering dependencies
afterEvaluate {
    sourceSets.client.compileClasspath += sourceSets.main.output
    sourceSets.client.compileClasspath += sourceSets.main.compileClasspath
    sourceSets.client.compileClasspath += configurations.modImplementation
    sourceSets.client.compileClasspath += project.configurations.runtimeClasspath
    sourceSets.client.compileClasspath += project.configurations.compileClasspath
}